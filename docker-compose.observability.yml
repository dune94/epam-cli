version: '3.8'
# name: the DEV project identity — a hand-run `docker compose up` here (no -p flag) would
# otherwise default to the directory basename ("epam-cli"). Naming it explicitly is what lets
# install.sh's isolated "test-install-amsd-pipeline-*" project names (lib/isolated-compose-
# identity.sh) be STRUCTURALLY unable to collide with this one, by construction, not by luck.
name: dev-amsd-pipeline
# Slim observability stack: Langfuse + agent-monitor only.
# Avoids the full epam-cli stack (no hydra/kratos/backend-stub).
#
# Port conflict fixes vs docker-compose.epam-cli.yml:
#   - clickhouse: 9000 external removed (SonarQube owns it); 8123 kept for health checks
#   - postgres: uses internal port only (no external 5432 mapping needed)
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#   Open: http://localhost:3100  (Langfuse — login: dev@epam-cli.local / dev1234)
#   Open: http://localhost:8092  (Agent monitor dashboard)

# THE SUBNET IS DECLARED, because a VPN makes docker unable to choose one.
#
# Docker refuses any candidate address pool that conflicts with an existing route. A full-tunnel
# VPN installs 0.0.0.0/1 and 128.0.0.0/1, which together cover the entire IPv4 space — so EVERY
# pool conflicts and the daemon reports "all predefined address pools have been fully subnetted"
# while 26 of its 32 pools are unused. The message names exhaustion; the cause is a route.
#
# Naming the subnet skips the pool search entirely. It is overridable so a machine where this range
# is genuinely in use can move it without editing this file, and it is the reason an install
# succeeds on a corporate laptop with the VPN up — which is the normal case, not the exception.
networks:
  default:
    ipam:
      config:
        - subnet: ${EPAM_OBS_SUBNET:-172.31.0.0/16}

# EVERY PUBLISHED PORT IS OVERRIDABLE, for the same reason the subnet is: a second install on this
# machine (or this install colliding with an already-running one) needs somewhere else to go.
# install.sh already isolates the compose PROJECT NAME and the SUBNET deterministically per
# destination — found 2026-09-03 that the four hardcoded host ports below (8123, 3100, 8092, 3001)
# were the one thing that still collided even with both of those isolated: a fresh install's
# observability stack failed with "port is already allocated" against an already-running one on
# this exact machine. EPAM_OBS_CLICKHOUSE_PORT / EPAM_OBS_LANGFUSE_PORT / EPAM_OBS_DASHBOARD_PORT /
# EPAM_OBS_GRAFANA_PORT close that; the defaults are unchanged so a normal single-install machine
# needs no new configuration.

services:

  postgres:
    image: postgres:16-alpine
    # Bounded: an unbounded container is entitled to the whole host, and on WSL the OOM
    # victim is the environment, not the container. memswap_limit matches mem_limit so a
    # throttled process cannot escape the ceiling into swap.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: epam
      POSTGRES_PASSWORD: epam_dev
      POSTGRES_DB: epam
    volumes:
      - obs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epam"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Bounded: an unbounded container is entitled to the whole host, and on WSL the OOM
    # victim is the environment, not the container. memswap_limit matches mem_limit so a
    # throttled process cannot escape the ceiling into swap.
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - obs_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "${EPAM_OBS_CLICKHOUSE_PORT:-8123}:8123"
      # Port 9000 intentionally NOT exposed — conflicts with SonarQube on host.
      # Langfuse connects via internal Docker network (clickhouse:9000).
    # BOUNDED HERE, IN THE TRACKED FILE — never in the override.
    #
    # docker-compose.observability.override.yml is GENERATED by pre-run-reset.sh on every run, so a
    # limit written there is silently erased at the next launch. That is exactly what happened: the
    # container was running with a 2GiB cap that no longer existed in any file on disk.
    #
    # ClickHouse is the largest consumer on this machine by a wide margin, and it sizes its caches
    # from the memory it believes it has. Version 24 reads the cgroup limit, so capping the
    # container is what makes it plan against 512MiB instead of the host's 14GiB. memswap_limit is
    # equal to mem_limit deliberately: without it a throttled process escapes into swap and the
    # bound becomes advisory.
    # 1GiB, MEASURED — not guessed. At 512m the server was OOM-killed (exit 137) within seconds of
    # start, before it finished loading. It had been running at 1.55GiB, so this is a real
    # reduction and not a free one: it is comfortable idle and could still be tight while ingesting
    # a long recording run. If exit 137 reappears during a run, this is the number to raise.
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - obs_clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      retries: 10

  langfuse-server:
    image: langfuse/langfuse:2
    # Bounded: an unbounded container is entitled to the whole host, and on WSL the OOM
    # victim is the environment, not the container. memswap_limit matches mem_limit so a
    # throttled process cannot escape the ceiling into swap.
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "${EPAM_OBS_LANGFUSE_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgres://epam:epam_dev@postgres:5432/epam
      NEXTAUTH_URL: http://localhost:${EPAM_OBS_LANGFUSE_PORT:-3100}
      NEXTAUTH_SECRET: langfuse-dev-secret-change-in-production
      SALT: langfuse-dev-salt-change-in-production
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: epam-dev
      LANGFUSE_INIT_ORG_NAME: "EPAM CLI Dev"
      LANGFUSE_INIT_PROJECT_ID: epam-cli
      LANGFUSE_INIT_PROJECT_NAME: "epam-cli"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-epam-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-epam-dev
      LANGFUSE_INIT_USER_EMAIL: dev@epam-cli.local
      LANGFUSE_INIT_USER_PASSWORD: dev12345
      LANGFUSE_INIT_USER_NAME: "Developer"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      # Langfuse (Next.js standalone) binds to the container's network IP, NOT
      # loopback — so probing localhost:3000 from inside the container is always
      # "connection refused" and the container sat "unhealthy" for 45h while
      # actually serving HTTP 200 fine (found 2026-07-24). Probe the container's
      # own IP instead. $$ escapes to a literal $ for the container shell.
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):3000/api/public/health || exit 1"]
      interval: 15s
      retries: 10

  # NOTE: there is deliberately NO langfuse-worker service.
  # The separate worker (plus its ClickHouse/Redis async pipeline) is a Langfuse
  # v3 architecture. This stack pins langfuse/langfuse:2, which is MONOLITHIC —
  # the web image contains no packages/worker/dist/app.js, and the v2 server
  # reads/writes Postgres directly ("Read from postgres only" in its own logs).
  # A worker service defined against the :2 image crash-loops on MODULE_NOT_FOUND
  # forever; the one here had accumulated 10,034 failed restarts, had never once
  # started, and nothing depended on it. Removed 2026-07-24. If Langfuse is ever
  # upgraded to v3, add it back as the SEPARATE langfuse/langfuse-worker:3 image
  # (not the web image with an overridden command).

  agent-monitor:
    image: nginx:alpine
    # Bounded: an unbounded container is entitled to the whole host, and on WSL the OOM
    # victim is the environment, not the container. memswap_limit matches mem_limit so a
    # throttled process cannot escape the ceiling into swap.
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "${EPAM_OBS_DASHBOARD_PORT:-8092}:80"
    volumes:
      - ./orchestrations/dashboards/nginx-main.conf:/etc/nginx/nginx.conf
      - ./orchestrations/dashboards/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./orchestrations/dashboards/njs:/etc/nginx/njs
      - ./orchestrations/dashboards/live:/usr/share/nginx/html
      # /prd-dir and /logs-dir are set by pre-run-reset.sh's compose OVERRIDE
      # (docker-compose.observability.override.yml), mounting the active PRD's
      # PARENT DIRECTORY and the active run's LOG_DIR respectively — NOT the
      # files themselves (see pre-run-reset.sh for why a directory mount is
      # required, not optional; found live 2026-07-13 both for the PRD, which
      # goes stale the instant it's rewritten via atomic tmp+rename, and for
      # logs, which for external-project runs live in the target project's own
      # directory, never here). No default here, same as /prd-dir: until
      # pre-run-reset.sh runs at least once, /prd.json and /logs/* both 404.
      # /profiles-dir is a directory mount for the same reason: profiles.json
      # is rewritten via atomic tmp+rename by the pipeline, which orphans a
      # single-file bind mount the instant it happens (found live 2026-07-13).
      - ./orchestrations/agents:/profiles-dir:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      retries: 3

  grafana:
    image: grafana/grafana:11.4.0
    # Bounded: an unbounded container is entitled to the whole host, and on WSL the OOM
    # victim is the environment, not the container. memswap_limit matches mem_limit so a
    # throttled process cannot escape the ceiling into swap.
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "${EPAM_OBS_GRAFANA_PORT:-3001}:3000"
    environment:
      # Community "Infinity" plugin — reads arbitrary JSON/JSONL over HTTP,
      # so Grafana queries the SAME endpoints agent-monitor already serves
      # (prd.json, /logs/agent-status.json, /logs/phase-cost.jsonl,
      # /logs/agent-activity.jsonl) directly. No new database/exporter,
      # same trust boundary as the existing unauthenticated localhost:8092
      # dashboard.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # First-run-only default password; change via the UI or override this
      # env var for anything beyond local dev use.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - obs_grafana_data:/var/lib/grafana
      - ./orchestrations/dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./orchestrations/dashboards/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      agent-monitor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      retries: 10

volumes:
  obs_postgres_data:
  obs_redis_data:
  obs_clickhouse_data:
  obs_grafana_data:
