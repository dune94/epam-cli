# The launch dashboard. Deliberately separate from docker-compose.observability.yml: this is the
# non-technical surface, and it must be installable without Langfuse, Grafana or ClickHouse.
#
# THE PIPELINE IS NOT HERE. It runs on the host, and so does the runner that starts it:
#
#     node launch-dashboard/backend/src/runner-host.js
#
# The container-to-host boundary is ./spool, bind-mounted below. The containers never receive host
# privileges — no docker socket, no ssh key.
services:
  launch-api:
    build: ./backend
    restart: unless-stopped
    # THE CONTAINER WRITES AS THE HOST OWNER OF THE BIND MOUNTS.
    #
    # The image creates an `epam` user (uid 100) and chowns /data and /spool — and a bind mount
    # REPLACES those directories with the host's, owned by whoever ran the installer. The chown in
    # the Dockerfile applies to a directory the mount then hides, so the API died on every start
    # with "unable to open database file" and simply restarted forever.
    #
    # ./spool cannot become a named volume: it is the boundary the HOST runner reads and writes, so
    # a host process must own it. Aligning the container's uid with the host's is what makes one
    # directory writable by both. Still non-root, and overridable for a host where the installing
    # user is not 1000.
    user: "${LAUNCH_UID:-1000}:${LAUNCH_GID:-1000}"
    environment:
      # REQUIRED — the server refuses to start without it. Gates a button that spends real money.
      LAUNCH_PASSWORD: ${LAUNCH_PASSWORD:?set LAUNCH_PASSWORD in .env}
      EPAM_CODE_LEVEL: ${EPAM_CODE_LEVEL:-}
      # THE OPERATOR PICKS THE PROVIDER SET PER LAUNCH NOW — no server-wide EPAM_PROVIDER_SET.
      # This is where the picker's OWN options come from, read once at startup (provider-sets.js);
      # a mount, not a value, so a set added upstream needs no rebuild here.
      PROVIDER_SETS_FILE: /orchestrations-config/provider-sets.json
    volumes:
      - ./data:/data          # runs.db — history survives a restart
      - ./spool:/spool        # the only channel to the host runner
      # READ-ONLY: the API lists provider sets, it must never be able to edit the pipeline's own
      # declaration of them.
      - ../orchestrations/config:/orchestrations-config:ro
    # Bounded, because a client install must not kill the machine. Sized for an API that lists rows.
    mem_limit: 256m
    memswap_limit: 256m

  launch-ui:
    build:
      context: ./frontend
      args:
        # Compiled INTO the bundle, so changing the title needs a rebuild of this image — that is
        # what --dart-define means. Empty is fine: config.dart then shows project-neutral wording.
        APP_TITLE: ${LAUNCH_TITLE:-}
    restart: unless-stopped
    depends_on: [launch-api]
    ports:
      - "${LAUNCH_UI_PORT:-8099}:80"
    mem_limit: 128m
    memswap_limit: 128m

# THE SUBNET IS DECLARED, because a busy daemon will not hand one out.
#
# Docker allocates compose networks from a default pool of /16s under 172.16.0.0/12. On a machine
# that has created and destroyed many stacks — worktree runs each get their own project network —
# the daemon reports "all predefined address pools have been fully subnetted" even after the idle
# networks are removed: the allocation is not released until the daemon restarts, and restarting it
# bounces every unrelated container on the box.
#
# Declaring the subnet skips the allocator entirely. It is overridable, so a machine where this
# range is genuinely taken can move it without editing this file.
networks:
  default:
    ipam:
      config:
        - subnet: ${LAUNCH_SUBNET:-172.30.0.0/16}
