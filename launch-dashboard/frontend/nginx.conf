server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API. The browser talks to one host, so the Flutter bundle needs no API_BASE, and
  # there is no CORS configuration to get wrong.
  location /api/ {
    # LOOPBACK, NOT A SERVICE NAME. Resolving "launch-api" needs the engine's DNS server;
    # docker always runs one, rootless podman on some hosts never starts aardvark-dns and nginx
    # then dies "host not found in upstream" forever. launch-ui shares launch-api's network
    # namespace (see docker-compose.yml), so the API IS this container's loopback — no resolver
    # involved on any runtime.
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    # A run takes minutes; the default 60s read timeout would sever a slow response.
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
