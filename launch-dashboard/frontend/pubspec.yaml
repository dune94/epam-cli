name: epam_launch_dashboard
description: Create a run from a Jira ticket, watch it, stop it. Nothing else.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # localStorage, so a refresh does not log you out. The modern replacement for dart:html;
  # it is an SDK-aligned package, not a plugin, so there is nothing to register.
  web: ^1.1.0

# The frontend shipped with NO dev_dependencies, so `flutter test` could not run at all and the
# generated widget_test.dart had never executed. Every control on the dashboard — resume, replay,
# stop — is derived from a status string in api.dart, and those derivations had no test of any
# kind. The 2026-09-04 stale-resume-button report was in exactly that code.
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
