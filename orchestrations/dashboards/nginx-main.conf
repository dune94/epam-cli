# Full replacement for nginx:alpine's stock /etc/nginx/nginx.conf.
# load_module must be in this top-level (main) context — it cannot go in a
# conf.d/*.conf file, which is only ever included from inside http{}.
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Converts *.jsonl pipeline logs to a real JSON array on the fly — see
    # njs/jsonl-to-json.js for why this exists (Infinity datasource has no
    # native JSON-Lines support).
    js_import jsonl from /etc/nginx/njs/jsonl-to-json.js;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
