server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index prd-viewer.html;

    # Active PRD — pre-run-reset.sh bind-mounts the PRD's PARENT DIRECTORY (not
    # the file itself) at /prd-dir, and patches the basename below via sed.
    # Root cause this avoids: the orchestration pipeline writes the PRD via
    # atomic tmp+rename (jq ... > tmp && mv tmp file / fs.renameSync) — the
    # correct, corruption-safe pattern used throughout this codebase — but
    # every rename() creates a NEW inode at that path. A single-FILE bind
    # mount is fixed to the inode present at mount time, so it silently goes
    # stale (serving a frozen snapshot from container-creation time) the very
    # first time the PRD is rewritten after the mount is established — found
    # live 2026-07-13, after "months and months" of the dashboard quietly
    # serving canonical/stale data instead of the live run's PRD. A directory
    # bind mount doesn't have this problem: renames INSIDE the mounted
    # directory are visible immediately, no restart required.
    location = /prd.json {
        alias /prd-dir/prd.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Agent profiles — same directory-mount rationale as /prd.json above.
    location = /profiles.json {
        alias /profiles-dir/profiles.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Run logs — pre-run-reset.sh mounts the ACTUAL run's LOG_DIR at /logs-dir
    # (directory mount; --log-dir defaults to orchestrations/logs, but external-
    # project runs, e.g. tier3-*-run.sh, pass --log-dir "$OUTPUT_DIR" since
    # run-agent-orchestration.sh's own LOG_DIR resolves to the target project's
    # directory, not orchestrations/logs). Found live 2026-07-13: monitor.html's
    # Pipeline Steps / Activity Feed / Live Execution Panel were silently
    # reading an unrelated, empty orchestrations/logs for every external-
    # project run, while the real step-status.json/agent-status.json/
    # agent-activity.jsonl/phase-cost.jsonl sat in the target project the
    # whole time. Trailing slash on both sides — alias correctly maps
    # /logs/whatever (including subpaths like logs/messages/outbox/) to
    # /logs-dir/whatever.
    #
    # `^~` is required, not cosmetic: nginx always prefers a matching regex
    # location (like `\.(json|jsonl)$` below) over a plain prefix location
    # regardless of declaration order or prefix length. Without `^~`, any
    # request under /logs/ ending in .json/.jsonl fell through to that regex
    # block instead (which has no alias of its own, so it 404'd against the
    # docroot) — found live 2026-07-13 while verifying this exact fix.
    location ^~ /logs/ {
        alias /logs-dir/;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # /logs-json/<name>.jsonl — same underlying files as /logs/<name>.jsonl,
    # but re-served as a valid JSON array (see njs/jsonl-to-json.js) so
    # Grafana's Infinity datasource (whose "json" parser does a single
    # JSON.parse() on the whole body) can actually read them. Dashboards that
    # query a .jsonl file must use this path, not /logs/.
    location ^~ /logs-json/ {
        js_content jsonl.toJson;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # API endpoints - no cache
    location ~* \.(json|jsonl)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets - can cache
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
