server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index prd-viewer.html;

    # Active PRD — mounted at /prd/active.json by pre-run-reset.sh via compose override.
    # Works for any PRD regardless of location (inside or outside the project).
    location = /prd.json {
        alias /prd/active.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # API endpoints - no cache
    location ~* \.(json|jsonl)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets - can cache
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
